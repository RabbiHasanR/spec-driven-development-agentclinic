name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: agentclinic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrates a fresh volume, then serves)
        env:
          # Throwaway values for this check only; not real credentials.
          STAFF_PASSWORD: ci-only-password
          SESSION_SECRET: ci-only-session-secret-at-least-32-chars
        run: |
          docker run -d --name app -p 3000:3000 \
            -e STAFF_PASSWORD -e SESSION_SECRET agentclinic:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
